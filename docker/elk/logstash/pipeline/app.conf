input {
    beats {
        port => 5044
    }
}

filter {
    json {
        source => "message"
        skip_on_invalid_json => true
    }

    # Extract event timestamp from 'time' or fallback 'timestamp'
    if [time] {
        date {
            match => [ "time", "ISO8601" ]
            target => "@timestamp"
            remove_field => [ "time" ]
        }
    }
    else if [timestamp] {
        date {
            match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd'T'HH:mm:ss.SSSZ" ]
            target => "@timestamp"
            remove_field => [ "timestamp" ]
        }
    }

    # Map log level to ECS field structure
    if [level] {
        mutate {
            add_field => {
                "[log][level]" => "%{level}"
            }
            remove_field => [ "level" ]
        }
    }

    # Normalize the top-level fields emitted by the Go logger (cat/sub are
    # passed as separate function args, so they land as their own top-level
    # keys) to match the template schema.
    mutate {
        rename => {
            "Category" => "category"
            "SubCategory" => "sub_category"
            "AppName" => "app_name"
            "LoggerName" => "[log][logger]"
        }
    }

    # NOTE: "extra" (map[ExtraKey]interface{} in category.go/logger.go) is
    # left untouched on purpose. Its keys (UserID, ChatID, TargetAccountID,
    # OwnerID, Role, Action, Username, Limit, Offset, ErrorMessage, and any
    # future ExtraKey added to category.go) arrive already nested under
    # "extra" and are indexed as-is by the "flattened" mapping in the index
    # template — no per-key rename/mapping needed, and no mapping-explosion
    # or type-conflict risk since "flattened" treats every leaf as a keyword.

    if [log][level] =~ /(?i)(error|fatal|panic)/ {
        mutate {
            add_tag => [ "app_error", "crash_loop" ]
        }
    }
}

output {
    elasticsearch {
        hosts => ["${ELASTIC_URL:http://elasticsearch:9200}"]
        index => "app-logs-%{+YYYY.MM.dd}"
        user => "elastic"
        password => "${ELASTIC_PASSWORD}"
    }

    stdout {
        codec => rubydebug
    }
}