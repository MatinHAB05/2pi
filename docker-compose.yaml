services:
  db:
    image: postgres:${POSTGRES_VERSION:-15}-alpine
    container_name: ${POSTGRES_CONTAINER:-2pi_postgres_db}
    restart: always
    environment:
      POSTGRES_USER: ${PDB_USER}
      POSTGRES_PASSWORD: ${PDB_PASSWORD}
      POSTGRES_DB: ${PDB_DB_NAME}
      TZ: ${PDB_TZ:-UTC}
    ports:
      - "${POSTGRES_HOST_PORT:-15015}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - 2pi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PDB_USER} -d ${PDB_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  redis:
    image: redis:${REDIS_VERSION:-7}-alpine
    container_name: ${REDIS_CONTAINER:-2pi_redis_db}
    restart: always
    command: redis-server --requirepass ${RDB_PASSWORD}
    ports:
      - "${REDIS_HOST_PORT:-15016}:6379"
    volumes:
      - redisdata:/data
    networks:
      - 2pi_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${RDB_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  # pgadmin:
  #   image: dpage/pgadmin4:${PGADMIN_VERSION:-latest}
  #   container_name: ${PGADMIN_CONTAINER:-2pi_pgadmin}
  #   restart: always
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
  #   ports:
  #     - "${PGADMIN_PORT:-15017}:80"
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin
  #   depends_on:
  #     - db
  #   networks:
  #     - 2pi_network
  #   env_file:
  #     - .env

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-8.11.0}
    container_name: ${ES_CONTAINER:-2pi_elasticsearch}
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ES_PASSWORD}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ES_HOST_PORT:-15018}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./setting/synonyms.txt:/usr/share/elasticsearch/config/synonyms.txt:ro
    networks:
      - 2pi_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -u elastic:${ES_PASSWORD} -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    env_file:
      - .env

  init-es:
    image: curlimages/curl:latest
    container_name: ${INIT_ES_CONTAINER}
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ES_PASSWORD: ${ES_PASSWORD}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
    volumes:
      - ./scripts/es-init.sh:/es-init.sh:ro
    entrypoint: ["/bin/sh", "/es-init.sh"]
    networks:
      - 2pi_network

  kibana:
    image: docker.elastic.co/kibana/kibana:${KIBANA_VERSION:-8.11.0}
    container_name: ${KIBANA_CONTAINER:-2pi_kibana}
    restart: always
    ports:
      - "${KIBANA_HOST_PORT:-15019}:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
    depends_on:
      init-es:
        condition: service_completed_successfully
    networks:
      - 2pi_network
    env_file:
      - .env

volumes:
  pgdata:
  redisdata:
  # pgadmin_data:
  es_data:

networks:
  2pi_network:
    driver: bridge
